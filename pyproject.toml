[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-region-fix"
version = "1.5.0"
description = "Локальный патч регионального гейта Antigravity CLI и приложения (Linux/macOS/Windows)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "sr9ch" }]
keywords = ["antigravity", "agy", "patch", "elf", "macho", "macos", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

[project.urls]
Homepage = "https://github.com/sr9ch/antigravity_patcher"
Source = "https://github.com/sr9ch/antigravity_patcher"

[project.scripts]
agy-region-fix = "agy_region_fix:cli"

[tool.setuptools]
py-modules = ["agy_region_fix"]
