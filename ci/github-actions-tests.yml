# Готовый workflow для GitHub Actions.
#
# Токен `gh` в этом окружении без scope `workflow`, поэтому файл лежит здесь,
# а не в .github/workflows/. Включить:
#
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   git mv ci/github-actions-tests.yml .github/workflows/tests.yml
#   git commit -m "ci: enable workflow" && git push
#
name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Синтаксис
        run: |
          python -m py_compile agy_region_fix.py tests/test_patcher.py
          bash -n agy-region-fix

      - name: Юнит-тесты
        run: python tests/test_patcher.py

      - name: CLI отвечает
        run: |
          ./agy-region-fix --version
          ./agy-region-fix gates

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Синтаксис
        run: python -m py_compile agy_region_fix.py tests/test_patcher.py
      - name: Юнит-тесты
        run: python tests/test_patcher.py
      - name: CLI отвечает
        run: |
          python agy_region_fix.py --version
          python agy_region_fix.py gates
